name: Deploy to VPS

on:
  push:
    branches:
      - main  # Or the branch you want to trigger the deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Set up Node.js version 20.x
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # Checkout the code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up SSH manually
      - name: Set up SSH manually
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 103.127.97.47>> ~/.ssh/known_hosts

      # Run deployment script via SSH
      - name: Deploy to VPS via SSH
        env:
          NODE_ENV: production
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no BundaranMonyet@103.127.97.47 << 'EOF'         

            sudo docker stop redis

            # Navigate to your project directory
            cd trx-api-service

            rm -r redis_data

            # Pull latest changes
            git pull origin main

            # Install dependencies and build project
            npm install
            npm build

            # Restart application with pm2
            pm2 restart 2 --update-env
          EOF